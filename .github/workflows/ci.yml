name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Generated skill module is committed and current
        run: |
          npm run gen:skill
          git diff --exit-code -- src/generated

  install-smoke:
    name: install smoke (npm i -g yields a working hgi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/smoke-install.sh

  binary-linux:
    name: binary e2e (linux-x64 single executable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/build-binaries.sh linux-x64 linux-arm64
      - run: bash scripts/smoke-binary.sh dist-bin/hgi-linux-x64
      - run: bash scripts/test-binary-e2e.sh dist-bin/hgi-linux-x64
      - name: Release assets package from the freshly built binaries, and the npm tarball installs
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm run build
          bash scripts/package-release.sh "$version" dist-bin /tmp/release-dry-run
          bash scripts/smoke-install.sh "/tmp/release-dry-run/hginsights-hgi-$version.tgz"

  changes:
    name: detect packaging changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then echo "packaging=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Capture the file list first: `git diff | grep -q` under pipefail fails when grep exits early,
          # which would wrongly report "no packaging changes" and skip the macOS gate.
          changed="$(git diff --name-only "$BASE"...HEAD)"
          if grep -Eq '^(packaging/|scripts/|\.github/workflows/(ci|release)\.yml|src/commands/skill\.ts|src/generated/|tsup\.sea\.config\.ts|package\.json|npm-shrinkwrap\.json)' <<<"$changed"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  # Skipped (counts as passing) unless packaging files changed, so it is safe to leave out of the
  # required-check list or to include it: a skipped job never leaves a required check "Expected".
  binary-macos:
    name: binary e2e (darwin-arm64)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/build-binaries.sh darwin-arm64 darwin-x64
      - run: bash scripts/smoke-binary.sh dist-bin/hgi-darwin-x64
      - run: bash scripts/test-binary-e2e.sh dist-bin/hgi-darwin-arm64
